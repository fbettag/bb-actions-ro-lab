name: issue-comment-cache
# Residual: issue_comment was a classic cache poison vector pre-RO policy
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  comment-poison:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/cache-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore default key from issue_comment context
        uses: actions/cache/restore@v4
        with:
          path: cache-seed
          key: ro-residual-shared-key-v1
      - name: Try write default key from issue_comment
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache-seed
          key: ro-residual-shared-key-v1
      - run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          ls -la cache-seed 2>/dev/null || true
          cat cache-seed/payload.txt 2>/dev/null || true
