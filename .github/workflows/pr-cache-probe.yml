name: pr-cache-probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try restore shared key from PR context
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache-seed
          key: ro-residual-shared-key-v2
      - name: Report restore
        run: |
          echo "cache-hit=${{ steps.restore.outputs.cache-hit }}"
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          cat cache-seed/payload.txt 2>/dev/null || echo no-payload
      - name: Overwrite attempt with POISON from PR
        run: |
          mkdir -p cache-seed
          echo "POISON_FROM_PR_event=${{ github.event_name }}_ref=${{ github.ref }}" > cache-seed/payload.txt
          cat cache-seed/payload.txt
      - name: Attempt save same key from PR (should fail RO after 2026-06)
        id: save
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache-seed
          key: ro-residual-shared-key-v2
      - name: Report save outcome
        run: |
          echo "save_outcome=${{ steps.save.outcome }}"
          echo "save_conclusion=${{ steps.save.conclusion }}"
