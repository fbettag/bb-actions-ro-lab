name: seed-default-cache
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write CLEAN payload
        run: |
          mkdir -p cache-seed
          echo "CLEAN_MAIN_PAYLOAD_v2_EXPECT_UNCHANGED" > cache-seed/payload.txt
          cat cache-seed/payload.txt
      - uses: actions/cache/save@v4
        with:
          path: cache-seed
          key: ro-residual-shared-key-v2
      - name: List after seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/caches --jq '.actions_caches[]|{id,key,ref}' || true
